name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          find include/ src/ adapters/ -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          path: ndn

      - name: Install esp-clang and run clang-check
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf_tools.py install esp-clang
          . $IDF_PATH/export.sh
          export IDF_TOOLCHAIN=clang
          cd ndn/test_app
          idf.py set-target esp32
          idf.py clang-check

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6]
    steps:
      - uses: actions/checkout@v6
        with:
          path: ndn

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: ndn/test_app
